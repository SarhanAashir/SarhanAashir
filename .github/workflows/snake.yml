name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Build contribution stats card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER: ${{ github.repository_owner }}
        run: |
          gh api graphql -f login="$USER" -f query='query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{date contributionCount}}}}}}' > cal.json
          read -r total current longest < <(jq -r '
            .data.user.contributionsCollection.contributionCalendar as $c
            | [$c.weeks[].contributionDays[].contributionCount] as $d
            | ($d | reduce .[] as $n ({cur:0,max:0}; if $n>0 then .cur+=1 | .max=([.max,.cur]|max) else .cur=0 end) | .max) as $longest
            | ($d | reverse | (if .[0]==0 then .[1:] else . end) | reduce .[] as $n ({n:0,stop:false}; if .stop then . elif $n>0 then .n+=1 else .stop=true end) | .n) as $current
            | "\($c.totalContributions) \($current) \($longest)"' cal.json)
          cat > dist/stats.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="495" height="165" viewBox="0 0 495 165">
            <rect width="495" height="165" rx="8" fill="#1a1b27"/>
            <g font-family="Segoe UI,Ubuntu,sans-serif" text-anchor="middle">
              <text x="82" y="78" font-size="30" font-weight="700" fill="#70a5fd">${total}</text>
              <text x="82" y="108" font-size="14" fill="#38bdae">Contributions</text>
              <text x="82" y="128" font-size="11" fill="#a9b1d6">last 12 months</text>
              <line x1="165" y1="35" x2="165" y2="135" stroke="#414868"/>
              <text x="247" y="78" font-size="30" font-weight="700" fill="#bf91f3">${current}</text>
              <text x="247" y="108" font-size="14" fill="#38bdae">Current streak</text>
              <text x="247" y="128" font-size="11" fill="#a9b1d6">days</text>
              <line x1="330" y1="35" x2="330" y2="135" stroke="#414868"/>
              <text x="412" y="78" font-size="30" font-weight="700" fill="#70a5fd">${longest}</text>
              <text x="412" y="108" font-size="14" fill="#38bdae">Longest streak</text>
              <text x="412" y="128" font-size="11" fill="#a9b1d6">days, last 12 months</text>
            </g>
          </svg>
          EOF

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
